    <meta name="theme-color" content="#070b12" />
    <meta name="description" content="A focused daily planner with local task storage, half-hour time blocks, date navigation, and print support." />
    <meta name="author" content="Ashish Ranjan" />
    <meta property="og:title" content="Daily Focus Planner" />
    <meta property="og:description" content="Plan tasks and half-hour time blocks with a focused daily planner." />

    <link rel="icon" type="image/x-icon" href="./public/favicon.ico" />

</head>

<body>
    <header class="topbar">
        <div class="container">
            <div class="brand">
                <img class="brand-logo" src="./public/logo.png" alt="" aria-hidden="true" />
                <h1>Daily Focus Planner</h1>
                <p>Plan with intention. Make progress visible.</p>
            </div>

            <div class="controls">
                <!-- Prev day -->
                <button id="prevDayBtn" class="circle" title="Previous day" aria-label="Previous day">‹</button>

                <!-- Date input + pretty text overlay -->
                <div class="date-wrap">
                    <label for="planDate" class="sr-only">Select Date</label>
                    <input type="date" id="planDate" />
                    <span id="datePretty" aria-hidden="true"></span>
                </div>

                <!-- Next day -->
                <button id="nextDayBtn" class="circle" title="Next day" aria-label="Next day">›</button>

                <button id="printBtn" title="Print the plan">Print</button>
                <button id="resetBtn" class="danger" title="Clear this day">Reset Day</button>
            </div>
        </div>
    </header>

    <main class="container">
        <section class="grid">
            <!-- Left: Tasks -->
            <section class="card">
                <div class="card-head">
                    <h2>Tasks</h2>
                    <button id="addTaskBtn" class="ghost" title="Add a new task">+ Add Task</button>
                </div>
                <p class="muted">Add as many tasks as you need. Check when done.</p>
                <div class="task-list" id="taskList"></div>
            </section>

            <!-- Right: Time blocks -->
            <section class="card">
                <h2>Time Blocks</h2>
                <p class="muted">Block your day in half-hours. Keep buffers.</p>
                <div id="timeBlocks" class="timeblocks"></div>
            </section>
        </section>
    </main>
